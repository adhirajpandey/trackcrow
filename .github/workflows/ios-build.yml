name: iOS build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ios-build.yml

permissions:
  contents: read

jobs:
  build:
    name: Unsigned iOS app
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Generate the iOS project
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: mobile/ios
        env:
          USE_FRAMEWORKS: static
        run: pod install

      - name: Build
        run: |
          xcodebuild \
            -workspace ios/TrackCrow.xcworkspace \
            -scheme TrackCrow \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package the .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/TrackCrow.app Payload/
          zip -qr TrackCrow-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TrackCrow-unsigned-ipa
          path: mobile/TrackCrow-unsigned.ipa
          retention-days: 14
